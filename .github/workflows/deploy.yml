name: Deploy Shiny App to shinyapps.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'
          
      - name: Restore packages
        uses: r-lib/actions/setup-renv@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("rsconnect", repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")'

      - name: Install Italian locale
        run: |
          sudo apt-get install -y locales
          sudo locale-gen it_IT.UTF-8
          sudo update-locale LANG=it_IT.UTF-8
      
      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            Sys.setlocale(category = 'LC_ALL', locale = 'it_IT.UTF-8');
            rsconnect::setAccountInfo(
              name='${SHINYAPPS_NAME}',
              token='${SHINYAPPS_TOKEN}',
              secret='${SHINYAPPS_SECRET}'
            );
            rsconnect::deployApp(forceUpdate = TRUE)
          "
